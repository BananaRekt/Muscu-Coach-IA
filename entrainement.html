<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muscu Coach IA</title><style>body{margin:0;background:#0f1115;color:#fff;font-family:Arial;padding:14px}.app{max-width:680px;margin:auto}.card{background:#171b22;border:1px solid #292f39;border-radius:18px;padding:16px;margin-bottom:14px}h1{font-size:25px}h2{font-size:23px}label{display:block;color:#aeb6c2;margin:12px 0 6px}select,input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:12px;border:1px solid #3a424e;font-size:16px}select,input{background:#10141a;color:#fff}button{background:#252c36;color:#fff;margin-top:8px;font-weight:700}.primary{background:#fff;color:#111}.row{display:flex;gap:7px}.row button{flex:1}.stat{background:#10141a;border-radius:12px;padding:12px;margin:9px 0;line-height:1.5}.muted{color:#aeb6c2}.hidden{display:none}.ok{color:#8fe39b}.warn{color:#ffd27a}.bar{height:8px;background:#282e38;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#fff;width:0}#timer{text-align:center;font-size:38px;font-weight:800;margin:8px}</style></head><body><div class="app"><div class="card" id="setup"><h1>🏋️ Muscu Coach IA</h1><label>📅 Jour réel</label><select id="day"><option>Lundi</option><option>Mardi</option><option>Mercredi</option><option>Jeudi</option><option>Vendredi</option><option>Samedi</option><option>Dimanche</option></select><label>🏋️ Séance</label><select id="session"><option value="A">Séance A</option><option value="B">Séance B</option></select><button class="primary" onclick="start()">Commencer la séance</button></div><div class="card hidden" id="work"><div id="count" class="muted"></div><div class="bar"><div id="bar"></div></div><h2 id="name"></h2><div id="sub" class="muted"></div><div id="previous" class="stat"></div><label>Charge utilisée (kg)</label><input id="load" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Ex. 5"><label>Répétitions</label><div class="row" id="reps"></div><label>Difficulté</label><div class="row"><button onclick="diff('facile')">Facile</button><button onclick="diff('correcte')">Correcte</button><button onclick="diff('difficile')">Difficile</button><button onclick="diff('très difficile')">Très difficile</button></div><label>Douleur</label><div class="row"><button onclick="pain(0)">0</button><button onclick="pain(2)">2</button><button onclick="pain(5)">5</button><button onclick="pain(8)">8+</button></div><div id="choice" class="stat">Sélectionne tes résultats.</div><button class="primary" onclick="finishSet()">Série terminée</button><div id="rest" class="hidden"><div id="timer">02:00</div><div id="restmsg" class="stat">Repos en cours…</div><button onclick="next()">Série suivante</button><button onclick="next()">Passer le repos</button></div><div id="decision" class="stat"></div></div><div class="card hidden" id="done"><h2>✅ Séance terminée</h2><p id="summary"></p><button class="primary" onclick="location.reload()">Nouvelle séance</button></div><div class="card"><h2>📋 Historique récent</h2><div id="hist"></div></div></div><script>let p,ex=[],ei=0,si=0,r=null,d=null,pa=null,timer;const K='muscuCoachHistoryV1',H=()=>JSON.parse(localStorage.getItem(K)||'[]');function save(x){let h=H();h.push(x);localStorage.setItem(K,JSON.stringify(h.slice(-500)));hist()}function hist(){let h=H().slice(-12).reverse();document.querySelector('#hist').innerHTML=h.length?h.map(x=>`<div class="stat"><b>${x.date}</b><br>${x.exercise} — série ${x.set}: ${x.load} kg · ${x.reps} reps · ${x.diff} · douleur ${x.pain}/10</div>`).join(''):'Aucune série enregistrée.'}async function load(){try{let q=await fetch('programme.json?'+Date.now(),{cache:'no-store'});p=await q.json();hist()}catch(e){alert('Impossible de charger programme.json.')}}function start(){ex=p.sessions[document.querySelector('#session').value].exercises||[];if(!ex.length)return alert('Cette séance ne contient aucun exercice.');ei=si=0;document.querySelector('#setup').classList.add('hidden');document.querySelector('#work').classList.remove('hidden');show()}function show(){let e=ex[ei],last=H().filter(x=>x.exercise===e.name).pop();document.querySelector('#count').textContent=`Exercice ${ei+1} / ${ex.length} · Série ${si+1} / ${e.sets}`;document.querySelector('#bar').style.width=((ei/ex.length)*100)+'%';document.querySelector('#name').textContent=e.name;document.querySelector('#sub').textContent=e.subtitle||'';document.querySelector('#previous').innerHTML=last?`Dernière fois : <b>${last.load} kg</b> · ${last.reps} répétitions · ${last.diff}`:'Première fois enregistrée : choisis une charge prudente et ajuste si nécessaire.';document.querySelector('#load').value=last?last.load:'';let b=document.querySelector('#reps');b.innerHTML='';for(let x=e.reps_min;x<=e.reps_max;x++){let z=document.createElement('button');z.textContent=x;z.onclick=()=>{r=x;document.querySelector('#choice').textContent=x+' répétitions sélectionnées.'};b.appendChild(z)}r=d=pa=null;document.querySelector('#choice').textContent=`Objectif : ${e.reps_min} à ${e.reps_max} répétitions.`;document.querySelector('#decision').textContent='';document.querySelector('#rest').classList.add('hidden')}function diff(x){d=x;document.querySelector('#choice').textContent='Difficulté : '+x+'.'}function pain(x){pa=x;document.querySelector('#choice').textContent='Douleur : '+x+'/10.'}function finishSet(){let e=ex[ei],load=Number(document.querySelector('#load').value);if(!load||r===null||!d||pa===null)return document.querySelector('#choice').textContent='Il manque une information.';let msg='Garde cette charge à la prochaine série.',cl='';if(pa>=8){msg='Arrête cet exercice pour aujourd’hui. La douleur est trop importante.';cl='warn'}else if(pa>=5){msg='Garde cette charge. N’augmente pas.';cl='warn'}else if(d==='très difficile'){msg='Ne monte pas la charge. Baisse-la légèrement si nécessaire.';cl='warn'}else if(d==='facile'&&r>=e.reps_max){msg='Tu peux essayer une petite augmentation à la prochaine série.';cl='ok'}save({date:new Date().toLocaleString('fr-FR'),day:document.querySelector('#day').value,session:document.querySelector('#session').value,exercise:e.name,set:si+1,load,reps:r,diff:d,pain:pa});document.querySelector('#decision').textContent=msg;document.querySelector('#decision').className='stat '+cl;if(pa>=8){si=e.sets;document.querySelector('#restmsg').textContent=msg;document.querySelector('#rest').classList.remove('hidden');return}rest()}function rest(){document.querySelector('#rest').classList.remove('hidden');let end=Date.now()+120000;clearInterval(timer);timer=setInterval(()=>{let s=Math.max(0,Math.ceil((end-Date.now())/1000));document.querySelector('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s){clearInterval(timer);document.querySelector('#restmsg').textContent='Repos terminé. Tu peux continuer.'}},250)}function next(){clearInterval(timer);if(si+1<ex[ei].sets){si++;show();return}ei++;si=0;if(ei>=ex.length){document.querySelector('#work').classList.add('hidden');document.querySelector('#done').classList.remove('hidden');document.querySelector('#summary').textContent='Toutes les séries prévues ont été enregistrées sur cet appareil.';return}show()}load()</script></body></html>
