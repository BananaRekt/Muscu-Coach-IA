<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muscu Coach IA</title><style>body{margin:0;background:#0f1115;color:#fff;font-family:Arial;padding:16px}.app{max-width:700px;margin:auto}.card{background:#171b22;border:1px solid #292f39;border-radius:18px;padding:16px;margin-bottom:14px}select{width:100%;padding:14px;margin:6px 0 12px;background:#10141a;color:#fff;border:1px solid #3a424e;border-radius:12px;font-size:16px}.exercise{font-size:25px;font-weight:800}.sub{color:#aeb6c2;margin:5px 0 15px}.gif{width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:#0b0d10}.status{color:#aeb6c2;line-height:1.5}.item{padding:12px;background:#10141a;border-radius:12px;margin-top:8px}</style></head><body><div class="app"><div class="card"><h1>🏋️ Muscu Coach IA</h1><label>📅 Jour réel</label><select id="day"><option>Lundi</option><option>Mardi</option><option>Mercredi</option><option>Jeudi</option><option>Vendredi</option><option>Samedi</option><option>Dimanche</option></select><label>🏋️ Séance</label><select id="session"><option value="A">Séance A</option><option value="B">Séance B</option></select></div><div class="card"><h2 id="sessionName">Chargement...</h2><div id="exercises"></div><p class="status" id="status"></p></div></div><script>let program=null;async function load(){const status=document.getElementById('status');try{const r=await fetch('programme.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();program=await r.json();render()}catch(e){status.textContent='Impossible de charger programme.json.'}}function render(){const key=document.getElementById('session').value;const s=program.sessions[key];document.getElementById('sessionName').textContent=s.name;const box=document.getElementById('exercises');box.innerHTML='';if(!s.exercises.length){box.innerHTML='<div class="item">Aucun exercice dans cette séance.</div>';return}s.exercises.forEach((e,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML='<strong>'+ (i+1)+'. '+e.name+'</strong><div class="sub">'+(e.subtitle||'')+'</div>'+(e.gif?'<img class="gif" src="'+e.gif+'" alt="GIF">':'')+'<div>3 séries · '+e.reps_min+'–'+e.reps_max+' répétitions · repos '+Math.round(e.rest_seconds/60)+' min</div>';box.appendChild(d)})}document.getElementById('session').addEventListener('change',render);document.getElementById('day').addEventListener('change',()=>{});load();</script></body></html>
